name: Add-on

on:
  # Every branch, as in ci.yaml, and for the same reason. The branch filter is
  # what keeps a bare `push:` from firing on tags as well: a release tag would
  # otherwise build an image and start a DDEV project for nothing, since this
  # job tests the add-on against the checkout it is run from and a tag has no
  # more to say about that than its branch did. `workflow_dispatch` is here so
  # the job can be run by hand once the file is on GitHub.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    name: Install, use and remove
    runs-on: ubuntu-latest
    # A stuck `ddev start` would otherwise hold the runner for the default six
    # hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # DDEV's own setup action; `v1` is its floating major tag (v1.12.1 when
      # this was written). `autostart: false` because the default is to run
      # `ddev start` in the checkout, which is not a DDEV project: the suite
      # creates its own project in a temporary directory.
      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # The setup action runs `ddev config global --omit-containers=
      # ddev-ssh-agent` to save a container nobody on a CI runner needs. This
      # add-on's sidecar does need it: it authenticates to remote hosts through
      # the agent DDEV forwards, and mounts that agent's socket volume, which
      # DDEV only declares while the agent is not omitted. Left omitted, DDEV
      # refuses to start the project and `ddev sync doctor` has no agent socket
      # to find, so the omission is undone before the suite creates its project.
      - name: Switch DDEV's ssh agent back on
        run: ddev config global --omit-containers=

      # Built from source at a fixed tag, not from apt: `ubuntu-latest` moves
      # between Ubuntu releases and their bats ranges from 1.2 (22.04) to 1.10
      # (24.04), while the suite needs 1.8 or newer for `test_tags` and
      # `--filter-tags`. Bats older than that has no such option and refuses
      # to start, so a stale install cannot quietly select the wrong tests.
      - name: Install bats
        run: |
          git clone --quiet --depth 1 --branch v1.14.0 \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local

      # So that a failure below can be read against the versions that produced
      # it.
      - name: Show the tool versions
        run: |
          bats --version
          ddev version

      # The suite builds the image itself and writes `.ddev/.env`, so there
      # is nothing to pass in. It is the add-on under test, not the image, and
      # a mismatch between them is exactly what this job should catch.
      #
      # Two selections, so that the release test's skip reads as a step of its
      # own instead of one line among the real results, and so that it is
      # already wired in the day it stops skipping (Plan 8).
      - name: Install from the checkout, use it, remove it
        run: bats tests/test.bats --filter-tags '!release' --print-output-on-failure

      # This step's whole value is that the release test is wired in, so it has
      # to fail if the selection stops reaching it - a typo in
      # `# bats test_tags=release` must not quietly empty the step. Bats 1.14,
      # the version pinned above, does exit 1 on a selection that matches
      # nothing, but that is a property of the runner rather than of this
      # workflow, so the TAP plan is asserted here: exactly one test selected,
      # and that one skipped rather than run. The day the release exists, the
      # `# skip` assertion is what has to be taken out.
      - name: Install from a release
        run: |
          out="$(bats tests/test.bats --filter-tags release --formatter tap)"
          echo "${out}"
          grep -qx '1\.\.1' <<<"${out}" \
            || { echo "the release test was not selected - check its test_tags" >&2; exit 1; }
          grep -q '^ok 1 .* # skip' <<<"${out}" \
            || { echo "the release test did not skip" >&2; exit 1; }
