name: CI

on:
  # Every branch, not just main: this repository merges fast-forward without
  # pull requests, so a main-only push trigger would run only after the merge.
  # The filter is what keeps a bare `push:` from firing on tags as well, as
  # in addon.yaml: a release tag has nothing to say about the gates that its
  # branch did not already say, and running them again builds the image for
  # nothing.
  push:
    branches: ["**"]
  pull_request:
  # So release.yaml can gate on these gates having passed on the very ref it
  # is about to release, rather than trusting that an earlier run still
  # applies. Nothing else about this workflow changes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes immutable releases and no floating major tag, so
      # `@v10` does not resolve: the full version is the shortest pin there is.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync the environment
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      # The 100 % line-and-branch gate lives in pyproject.toml's addopts, so
      # this needs no flags - and must not be given any that would weaken it.
      - name: pytest
        run: uv run pytest

  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # amd64 only, loaded into the runner's daemon: a multi-platform image
      # cannot be loaded, and nothing here is published. The multi-arch build
      # and the push belong to the release pipeline (Plan 6), which runs only
      # after the verification matrix (Plan 5) is green.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ddev-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must be self-sufficient after a pull: nothing installed at
      # container start, no network needed to run. `--network none` is what
      # turns that from an intention into a test.
      - name: It runs with no network at all
        run: |
          docker run --rm --network none ddev-sync:ci --version
          docker run --rm --network none ddev-sync:ci --help

      # One binary per `command -v`: busybox's builtin looks only at its first
      # argument and exits 0 on it, so a single multi-argument call would
      # assert nothing about the others. These are the binaries invoked inside
      # the sidecar: `mysql` and `mysqladmin` for the import, drop/create and
      # sanitize rules, `scp` and `ssh` for transport, `rsync` for the files
      # steps, `rclone` for S3 and `docker` for the web container. `mysqldump`
      # is checked too, but it is the one exception: every call is built
      # through `ssh_command`, so it runs on the remote host - the image just
      # happens to carry it, because `mariadb-client` ships it alongside the
      # two binaries above that really are needed here.
      - name: It carries every binary the engine runs locally
        run: |
          docker run --rm --network none --entrypoint sh ddev-sync:ci -c \
            'for b in ssh scp rsync mysql mysqladmin mysqldump rclone docker; do
               command -v "$b" || { echo "MISSING: $b"; exit 1; }
             done'

      - name: It resolves profiles from the installed path, not a checkout
        run: |
          test "$(docker run --rm --network none --entrypoint sh ddev-sync:ci -c \
            'python -c "from ddev_sync.profiles.registry import DEFAULT_PROFILE_ROOT; print(DEFAULT_PROFILE_ROOT)"')" \
            = "/opt/ddev-sync/profiles"

  integration:
    # The suite `gates` cannot see. `pyproject.toml`'s addopts deselect
    # `integration`, so the unit gate above is blind to every test that drives
    # a real container - which is how a branch that broke this whole suite
    # went green, shipping a database client that could not connect to any
    # local DDEV database. The suite brings its own stack up through
    # `docker compose` (tests/integration/conftest.py), so all this job
    # provides is the three tools that stack is driven with.
    name: Integration suite
    runs-on: ubuntu-latest
    # A compose stack that never becomes healthy would otherwise hold the
    # runner for the default six hours; the stack's own healthchecks allow up
    # to three minutes for the sshd container's package mod.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync the environment
        run: uv sync --frozen

      # The suite needs docker to start its stack, an ssh client to reach the
      # sshd container, and GNU rsync for `--info=progress2` (stock macOS
      # ships openrsync, which rejects it, and the conftest works around that
      # locally). The runner image carries all three; printing them here is
      # what turns that from an assumption into a line in the log, and gives
      # a failure below the versions it happened on.
      - name: Show the tool versions
        run: |
          docker --version
          docker compose version
          ssh -V
          rsync --version | head -1

      # `--no-cov` because the coverage gate in addopts belongs to the unit
      # suite, as in matrix.yaml: these tests drive the engine against
      # containers, and a 100 % threshold measured here would fail after every
      # test had passed. `-rs` so a skip states its reason in the log, which
      # the next step then refuses to accept.
      - name: Run the integration suite
        run: >-
          uv run pytest -m integration --no-cov -v -rs
          --junit-xml=integration-report.xml

      # The point of this job is that it verifies something, and a skip
      # verifies nothing while exiting 0. `conftest.py` skips the whole suite
      # when `docker info` fails - the right behaviour on a developer's
      # machine, and indistinguishable from success here. So a green run must
      # also have run its tests: any skip, and an empty report, fail the job.
      # (pytest exits 5 on a selection that collects nothing, so that case is
      # already red before this step.)
      - name: It actually ran
        if: always()
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("integration-report.xml")
          if not report.exists():
              sys.exit("no test report was written, so nothing can be said to have run")
          # `iter`, not `getroot()` itself: pytest writes a `<testsuites>` root
          # around one `<testsuite>`, and older versions wrote the single
          # element as the root. Iterating covers both spellings.
          suites = list(ET.parse(report).getroot().iter("testsuite"))
          total = sum(int(suite.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          if total == 0:
              sys.exit("the report holds no tests at all")
          if skipped:
              sys.exit(f"{skipped} of {total} integration tests were skipped, not run")
          print(f"{total} integration test{'s' if total != 1 else ''} ran, none skipped")
          PY
