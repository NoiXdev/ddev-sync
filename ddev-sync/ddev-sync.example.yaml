#ddev-generated
# Reference copy of the configuration template, installed by the ddev-sync
# add-on and replaced whenever the add-on is updated: do not edit it. Your
# own configuration is .ddev/ddev-sync.yaml, which was created from this
# template once. Everything above the blank line is left out of that copy.

# Configuration for ddev-sync in this project. This file is yours: the add-on
# never overwrites it, and `ddev add-on remove` leaves it alone.
#
# Targets usually belong in ~/.ddev/ddev-sync/config.yaml instead, so that
# your hosts and users are not committed with the project: the add-on mounts
# that directory into its container read-only, so a target defined there is
# read for this project too, and for every other project you install the
# add-on into. Keep in this file what the whole team shares.
#
# One target key is not available through the add-on: `ssh_alias`, which takes
# a host from ~/.ssh/config. That file is not mounted, and the entries in a
# real one point at identity files, Include directives and control paths that
# do not exist in the container. Name `host`, `user` and `port` here instead.
version: 1

# targets:
#   production:
#     host: web01.example
#     user: deploy
#     port: 22
#     path: /srv/app/
#     stage: production       # production | staging | testing | dev
#     layout: plain           # plain | deployer

# Or, when the project is deployed with Deployer, let it state the connection
# instead of repeating it here, in place of the target above. Beside the
# block, `host`, `user`, `port`, `path`, `layout` and `ssh_alias` must then
# not be set; `stage` is still required. The connection is read from
# `dep config` in the web container, so the project has to be running - and
# reading it evaluates the project's own `deploy.php`, even in a dry run.
#   production:
#     deployer:
#       host: web01.example     # Deployer's alias; omit if there is only one
#     stage: production

# Where the remote's database credentials come from:
#   env      - read from a .env on the remote (the default)
#   explicit - from `database.credentials` below; they are secrets, so put
#              them in .ddev/ddev-sync.local.yaml and make sure your
#              repository ignores that file - nothing here does that for you
#   wp_cli   - ask the remote's WP-CLI (WordPress; also reads the table prefix)
# database:
#   remote_credentials: env
#   credentials:              # only read when remote_credentials is explicit
#     host: db.internal
#     port: 3306
#     name: app
#     user: app
#     password: change-me
