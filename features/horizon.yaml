# Horizon's queue and supervisor state lives in Redis, not the database: its
# `JobRepository` binds to `RedisJobRepository` (src/ServiceBindings.php:23).
# That binding is the reason; a missing migration would only say nothing is
# there today. No release read here ships a `database/` or a `migrations/`
# directory - root listings read through the GitHub contents API at the tags
# v5.0.0, v5.10.0, v5.25.0 and v5.50.0, at the repository's default branch
# `5.x`, and at `master`, with `src/` present on every call as a positive
# control so that a zero means absence rather than a failed request. Four tags
# spanning v5.0.0 to the installed v5.50.0 is evidence for the 5.x line, not
# proof of every release in it. Only v5.50.0 was ever on disk here, the
# release the `mxfeathorizon` cell installed, and in it neither `horizon_jobs`
# nor `horizon_supervisors` occurs anywhere in the package.
#
# This comment used to claim "5.x and main". `main` is not a ref in that
# repository at all - the API answers "No commit found for the ref main" - so
# the citation named something that does not exist; the default branch is
# `5.x`, and `master` exists as a branch but is not the default. Whoever wrote
# it assumed the branch name instead of reading it, which is the mistake worth
# leaving here: a ref that 404s and a ref that moved look the same in prose.
#
# An earlier version of this file carried a sanitize.rules block that
# TRUNCATEd those two non-existent tables. That is worse than dead weight:
# operations/sanitize.py::_run_sql raises unconditionally on failure, with no
# allow_failure on that path, so on a Horizon project running any release read
# here the first TRUNCATE would have failed with "table doesn't exist" and
# aborted the entire sync right after the database import.
#
# Horizon is a feature rather than a base-profile rule because its presence
# genuinely varies. profiles/laravel.yaml's own `jobs`/`failed_jobs` rules
# are NOT a safety net for Horizon specifically: Horizon is Redis-backed, so
# a project that actually runs it typically has no `jobs`/`failed_jobs`
# tables to begin with (that pair only exists for the database queue driver,
# via the queue:table/queue:failed-table migrations) - truncating them there
# is at best a no-op on a Horizon project, not an assurance about Horizon's
# own state. (It is also no longer able to abort the sync if those tables
# are absent: both rules carry tolerate_missing_table, the same guard this
# file's own comment above describes for the two Horizon-specific tables
# that turned out not to exist.)
#
# This block used to end with "See the features design doc §5.1". There is no
# such document - `docs/` holds only `plans/` and `specs/`, and none of those
# specs is a features design doc or carries a §5.1. (Numbered headings do exist
# in this repository: `docs/specs/2026-10-08-sync-init-part-b2-design.md:232` is
# `### §8 item 3`. The claim here is about §5.1 and about a features design doc,
# not about numbering in general.) The pointer is dropped rather than repaired
# because the argument above does not need it - but two copies of the same
# reference still stand, both in profiles and so outside this branch's scope:
# `profiles/symfony.yaml:71` ("§5.1 of the features design doc") and
# `profiles/typo3.yaml:68` ("(spec §5.1)"), for the same scheduler/Messenger
# rule. Other `spec §` pointers elsewhere in the tree were not swept.
#
# What `horizon:clear` below actually does, and does not do (verified
# against the Laravel 11.x Horizon docs, "Clearing Jobs From Queues"):
# ddev-sync never syncs Redis, so there is no production queue state on this
# machine to begin with - the description used to read "so no production
# job runs locally", which claims a protection that cannot exist when
# nothing production-side was ever copied here. What this command actually
# clears is this developer's OWN local Redis queue: specifically, with no
# `--queue` option (as called here), it empties only the `default` queue -
# every other queue name is untouched. The real reason to run it after a
# sync is mundane but genuine: a local queue can be carrying jobs enqueued
# against the *previous* local database (e.g. "send a welcome email to user
# 42"), and once this sync has replaced that database, those jobs point at
# rows that may no longer exist or mean something different - clearing the
# backlog avoids them running against data they were never meant to see.
name: horizon
description: >-
  Clear this machine's own local Horizon "default" queue in Redis (not
  production's - ddev-sync never syncs Redis) so jobs left over from before
  this sync don't run against the freshly imported database.
applies_to: [laravel]

detect:
  composer_package: laravel/horizon

setup:
  commands:
    - { run: "php artisan horizon:clear", allow_failure: true }
