# Horizon's queue and supervisor state lives in Redis, not the database: it
# ships no migrations, and neither `horizon_jobs` nor `horizon_supervisors`
# exists as a table (checked against laravel/horizon 5.x and main — grepping
# the source turns up neither name). An earlier version of this file carried
# a sanitize.rules block that TRUNCATEd those two non-existent tables. That
# is worse than dead weight: operations/sanitize.py::_run_sql raises
# unconditionally on failure, with no allow_failure on that path, so on any
# project that actually has Horizon installed the first TRUNCATE would have
# failed with "table doesn't exist" and aborted the entire sync right after
# the database import - including the `horizon:clear` command below, which
# is the one that actually does the job, because the real state is in Redis.
#
# Horizon is a feature rather than a base-profile rule because its presence
# genuinely varies. profiles/laravel.yaml's own `jobs`/`failed_jobs` rules
# are NOT a safety net for Horizon specifically: Horizon is Redis-backed, so
# a project that actually runs it typically has no `jobs`/`failed_jobs`
# tables to begin with (that pair only exists for the database queue driver,
# via the queue:table/queue:failed-table migrations) - truncating them there
# is at best a no-op on a Horizon project, not an assurance about Horizon's
# own state. (It is also no longer able to abort the sync if those tables
# are absent: both rules carry tolerate_missing_table, the same guard this
# file's own comment above describes for the two Horizon-specific tables
# that turned out not to exist.) What actually protects a Horizon project is
# `horizon:clear` below, against Redis, where Horizon's real state lives.
# See the features design doc §5.1.
name: horizon
description: Clear Horizon's Redis-backed queue state so no production job runs locally.
applies_to: [laravel]

detect:
  composer_package: laravel/horizon

setup:
  commands:
    - { run: "php artisan horizon:clear", allow_failure: true }
