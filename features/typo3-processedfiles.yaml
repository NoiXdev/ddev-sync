# No detect block on purpose: every TYPO3 project has stale processed files
# after an import, but whether you care is a judgement, not a property of the
# project. Detecting it would mean activating it everywhere.
name: typo3-processedfiles
description: Drop stale processed images so TYPO3 regenerates them locally.
applies_to: [typo3]

sanitize:
  rules:
    - name: clear-processed-files
      sql: "TRUNCATE TABLE sys_file_processedfile"

# `${DDEV_DOCROOT}` (operations/placeholders.py), not a hardcoded "public/":
# a project whose web root is not named "public" would otherwise have its
# `sys_file_processedfile` table truncated above while the stale files on
# disk were left untouched entirely - a silent half-job, since the truncate
# has no way to know it disagreed with the rm. This narrows that gap, it
# does not close it: TYPO3's processing folder is configurable per
# `sys_file_storage` (the `processingfolder` setting), so a storage that
# overrides the default still keeps its processed files somewhere this
# fixed `fileadmin/_processed_` path does not reach. Pre-existing, and not
# something a single hardcoded (or single-placeholder) path can fix.
#
# No `allow_failure` here, unlike most of this profile/feature set's other
# optional commands: `rm -rf` already exits 0 when the directory is simply
# missing (the ordinary fresh-checkout case, before the first import), so
# `allow_failure` was never covering that case - it was only silently
# swallowing some OTHER failure (permission denied, a read-only filesystem)
# with nothing ever reported. Removing it makes that failure visible again.
setup:
  commands:
    - { run: "rm -rf ${DDEV_DOCROOT}/fileadmin/_processed_" }
