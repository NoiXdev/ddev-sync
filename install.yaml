name: ddev-sync

# The floor is the oldest DDEV this add-on is meant to run on; it is only
# checked at install time.
ddev_version_constraint: ">= v1.24.0"

project_files:
  - ddev-sync/ddev-sync.example.yaml

post_install_actions:
  - |
    #ddev-description:Copy the configuration template into place
    # Only when the project has no configuration yet: .ddev/ddev-sync.yaml
    # belongs to the project, so an existing one is never overwritten.
    #
    # Two things keep it safe from `ddev add-on remove`: it is not listed in
    # `project_files` (DDEV only deletes listed paths), and it carries no
    # generated-file marker (DDEV only deletes files that contain one). DDEV
    # does not add that marker itself, so the template carries it and the copy
    # drops it again, together with the template's own header up to the first
    # blank line.
    #
    # The copy goes through a temporary file: a failed sed must not leave a
    # partial .ddev/ddev-sync.yaml behind, because the existence check above
    # would then stop every later install from repairing it.
    target="${DDEV_APPROOT}/.ddev/ddev-sync.yaml"
    if [ ! -f "${target}" ]; then
      tmp="$(mktemp "${target}.XXXXXX")" || exit 1
      if sed '/^#ddev-generated$/,/^$/d' \
          "${DDEV_APPROOT}/.ddev/ddev-sync/ddev-sync.example.yaml" > "${tmp}" \
        && chmod 644 "${tmp}" && mv "${tmp}" "${target}"; then
        echo "Wrote .ddev/ddev-sync.yaml - edit it, then run 'ddev sync doctor'."
      else
        rm -f "${tmp}"
        echo "Could not write .ddev/ddev-sync.yaml" >&2
        exit 1
      fi
    fi
