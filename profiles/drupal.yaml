# Drupal. Credentials come from settings.php rather than an env file in most
# installs, so projects usually set database.credentials explicitly or add a
# settings.ddev.php; drush handles the rest.
name: drupal

detect:
  version_from:
    composer_package: drupal/core

env:
  strategy: none

database:
  remote_credentials: explicit

files:
  paths:
    - { remote: "web/sites/default/files/", local: "web/sites/default/files/" }

sanitize:
  rules:
    # `sessions` is not guaranteed to exist. Since Drupal 10.3 (change record
    # https://www.drupal.org/node/3431286, implemented in core issue #3428565)
    # the table's schema was moved out of `system_schema()` and into
    # `Drupal\Core\Session\SessionHandler`, which creates it lazily on its
    # first write rather than at install time - and a site that swaps in an
    # alternative session handler (e.g. Redis) never takes that write path at
    # all, so it never gets a `sessions` table in the first place. `_run_sql`
    # raises unconditionally on any other SQL error, so without
    # `tolerate_missing_table` this rule being first in the list would abort
    # every rule after it - anonymize-users, reset-user-passwords, admin
    # creation, cache flush - on a database already imported, the same bug
    # class profiles/typo3.yaml's clear-scheduler-tasks guards against.
    # `tolerate_missing_table` swallows only "table doesn't exist" (MySQL
    # errno 1146); any other failure here still raises exactly as before.
    - name: clear-sessions
      sql: "TRUNCATE TABLE sessions"
      tolerate_missing_table: true
    # `watchdog` belongs to Database Logging (dblog), a core module that can
    # be - and, on many production sites, deliberately is - disabled in
    # favour of the `syslog` module, which logs to the OS instead of the
    # database and so needs no table at all (see drupal.org's dblog/syslog
    # module pages). Without tolerate_missing_table, a project that disabled
    # dblog would fail this rule and never reach anonymize-users or
    # reset-user-passwords below, leaving real editor data on the laptop
    # with the database already imported - the same bug class
    # profiles/typo3.yaml's clear-scheduler-tasks guards against.
    - name: clear-watchdog
      sql: "TRUNCATE TABLE watchdog"
      tolerate_missing_table: true
    - name: anonymize-users
      sql: "UPDATE users_field_data SET mail = CONCAT('user', uid, '@example.invalid') WHERE uid > 0"
      requires_table: users_field_data
    # Unverified: table/column name assumed from Drupal core's conventional
    # `users_field_data.pass` (same table the anonymize rule above already
    # targets); see profiles/VERIFIED.md. No `uid > 0` guard here - resetting
    # uid 0's unused password hash alongside everyone else's is harmless.
    - name: reset-user-passwords
      operation: reset_passwords
      table: users_field_data
      column: pass
      value: "$argon2i$disabled"
    # `drush user:create` cannot assign a role, so the drush driver follows it
    # with `drush user:role:add <role> <user>`. The role defaults to
    # `administrator`, which Drupal's `standard` install profile creates; other
    # install profiles may not have it, and the engine stops with an error
    # naming the role if it does not exist. A rule-level `role: <machine name>`
    # is accepted, but a project cannot override just this rule: its
    # `sanitize.rules` extends this list by default, so changing the role means
    # replacing the whole list (`mode: replace`) and carrying the other rules
    # along.
    - name: local-admin
      operation: create_admin
      driver: drush
      user: ddev
    - name: flush-cache
      operation: flush_cache
      command: "vendor/bin/drush cache:rebuild"

setup:
  commands:
    - run: "composer install --no-interaction"
    - { run: "vendor/bin/drush updatedb --yes", allow_failure: true }
    - run: "vendor/bin/drush cache:rebuild"
