# Laravel. The DB_* convention has been stable since Laravel 5, so the database
# keys have no version variants; projects that differ override
# database.env_map. The profile as a whole does have one: the cache driver key
# was renamed (CACHE_DRIVER before Laravel 11, CACHE_STORE from 11), and both
# are imposed in env.set below.
name: laravel

detect:
  version_from:
    composer_package: laravel/framework

env:
  file: [.env]
  strategy: patch_keys
  # Imposed on every sync: the sync's own work makes the project's value here
  # wrong or dangerous (it imports a database locally, sets up the local site,
  # puts real addresses on a machine that can send mail, and runs commands
  # that consult APP_ENV and flush the configured cache). The one exception is
  # APP_DEBUG, which the sync does not make wrong; it was imposed before the
  # default mapping existed and stays so, to keep this change no wider than
  # the harm it fixes.
  set:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: "https://${DDEV_SITENAME}.ddev.site"
    DB_CONNECTION: mysql
    DB_HOST: "ddev-${DDEV_SITENAME}-db"
    DB_PORT: "3306"
    DB_DATABASE: "${SYNC_TARGET_DATABASE}"
    DB_USERNAME: db
    DB_PASSWORD: db
    MAIL_MAILER: smtp
    MAIL_HOST: localhost
    MAIL_PORT: "1025"
    # The connection target, pinned the way DB_HOST is. DDEV's Redis add-on
    # sets no environment variable at all - its compose file declares
    # `container_name: ddev-${DDEV_SITENAME}-redis` and
    # `hostname: ${REDIS_HOSTNAME:-redis}` and nothing else - so this collides
    # with nothing. That was read from installed copies of ddev-redis v2.2.0
    # (container_name and hostname as quoted, port 6379 exposed, no
    # `environment:` block); nothing in this repository can establish it, and
    # the add-on's compose file may change in a later release. The container
    # name is the half a project cannot rename out from under us. A project
    # whose Redis is elsewhere overrides this key; that is the accepted cost of
    # not letting a production .env reach production's Redis from a developer's
    # machine. The reason the pin exists is the setup step below: it runs
    # `optimize:clear`, which runs `cache:clear`, and Laravel's RedisStore
    # flushes with a bare `flushdb()`. A project that sets CACHE_STORE=redis in
    # its own env.set, with this key left at a production host, would have the
    # sync flush production's Redis.
    REDIS_HOST: "ddev-${DDEV_SITENAME}-redis"
    # Imposed although it is a driver choice, because the sync acts on the
    # store: the setup step `optimize:clear` runs `cache:clear` against
    # whatever store is configured. MemcachedStore::flush() flushes the whole
    # server, so a kept CACHE_STORE=memcached pointed off this machine would
    # be flushed by the sync, which is destroying data on infrastructure it
    # does not own; DynamoDbStore::flush() throws, so a kept dynamodb cache
    # would fail that step (which is not allow_failure). This costs a project
    # that runs a local Redis cache its choice on every sync; it sets
    # CACHE_STORE (CACHE_DRIVER on Laravel 10 and below) in its own env.set to
    # keep it, and REDIS_HOST above keeps that flush local. Imposing only non-local drivers is not expressible as
    # set versus default; see the follow-ups file, item 2.
    CACHE_STORE: file
    # The same key under its Laravel 10 and earlier name. laravel/laravel's
    # .env.example has `CACHE_DRIVER=file` at 10.x and `CACHE_STORE=database`
    # at 11.x and 12.x (read from those branches; nothing in this repository
    # establishes it), so on Laravel 10 and below the project's CACHE_DRIVER
    # still decides the cache and CACHE_STORE above is ignored, which would
    # leave the flush described above fully live. On Laravel 11 and later
    # nothing reads this key; patch_keys appends one inert line to the .env,
    # the accepted cost of not leaving older projects exposed.
    CACHE_DRIVER: file
  # The project's own choices. Written only when the project declares nothing,
  # so a Horizon installation keeps its queue and a Redis-backed session
  # survives a sync. They are defaulted because the project's value is
  # no more wrong after the sync than it was before: an sqs queue was
  # production's before the sync and still is. A pin on a host cannot protect
  # a driver whose target is a set of credentials rather than a host.
  #
  # ACCEPTED RISK: a project whose .env carries a remote driver with working
  # credentials keeps it. With QUEUE_CONNECTION=sqs and live AWS keys, a job
  # dispatched after a sync lands on the production queue without a word;
  # SESSION_DRIVER=dynamodb likewise uses production's session table. Nothing
  # the sync runs acts on either, which is why they are defaulted and
  # CACHE_STORE (see above) is not. That is a real consequence of this design,
  # not an oversight: the alternative is the old behaviour that took a Horizon
  # project's queue out of use without saying so. A project that needs these
  # forced local sets them in its own env.set.
  default:
    QUEUE_CONNECTION: sync
    SESSION_DRIVER: file

database:
  remote_credentials: env
  env_map:
    name: DB_DATABASE
    user: DB_USERNAME
    password: DB_PASSWORD
    host: DB_HOST
    port: DB_PORT

files:
  paths:
    - { remote: "storage/app/public/", local: "storage/app/public/" }

sanitize:
  rules:
    # These TRUNCATE tables that may not exist depending on project config:
    # `sessions` only exists with the `database` session driver (not `file`,
    # the profile's own default - see env.default.SESSION_DRIVER above); `jobs`
    # and `failed_jobs` only exist if the project ran the `queue:table` /
    # `queue:failed-table` migrations, which a Redis- or SQS-backed queue
    # never needs. `_run_sql` raises unconditionally and the executor stops
    # at the first failed rule (spec §9), so without `tolerate_missing_table`
    # a project missing any one of these - plausibly all three, on a fresh
    # Redis-queue install - never reaches `anonymize-users` or
    # `reset-user-passwords` below: real customer emails and password hashes
    # would stay on the developer's machine, with the database already
    # imported. This is the same bug class `tolerate_missing_table` was
    # added for in profiles/typo3.yaml's `clear-scheduler-tasks` (see that
    # file's comment) - overruling an earlier version of this comment here,
    # which argued a missing table should fail loudly. That argument loses
    # to "a sanitize rule that can run either runs or fails loudly, and a
    # rule that fails loudly must not also take the rules after it down with
    # it" - tolerate_missing_table swallows only "table doesn't exist"
    # (MySQL errno 1146); any other failure here still raises as before.
    - { name: clear-sessions, sql: "TRUNCATE TABLE sessions", tolerate_missing_table: true }
    - { name: clear-jobs, sql: "TRUNCATE TABLE jobs", tolerate_missing_table: true }
    - {
        name: clear-failed-jobs,
        sql: "TRUNCATE TABLE failed_jobs",
        tolerate_missing_table: true,
      }
    # `users` is hardcoded, unlike profiles/symfony.yaml's
    # `${SYMFONY_USER_TABLE}` placeholder - deliberately, not by oversight.
    # Symfony needed one because `user` is only MakerBundle's conventional
    # guess at a table name, and MakerBundle itself steers new projects away
    # from it (`user` is reserved in PostgreSQL). Laravel's `users` is
    # different in kind: it comes from the framework's own default
    # application skeleton (`database/migrations/..._create_users_table.php`,
    # generated by every fresh Laravel install since the framework shipped
    # authentication scaffolding) and from `Illuminate\Foundation\Auth`'s own
    # default guard configuration (`config/auth.php`'s `'table' => 'users'`),
    # not a convention bolted on by a separate package's generator. Nothing
    # stops a project from renaming it - migrations are user-editable, same
    # as everywhere else - but doing so means also changing the `users`
    # provider's `table` key in `config/auth.php`, the `User` model's
    # `$table` property, and every foreign key the default migrations point
    # at `users.id`; that is a deliberate, invasive, whole-project choice in
    # a way picking a different name for a scaffold MakerBundle itself
    # discourages is not. If this ever needs to be overridable in practice,
    # give it the same `${LARAVEL_USER_TABLE}`-shaped treatment as Symfony's -
    # but do not add the placeholder speculatively for a case nobody has hit.
    - name: anonymize-users
      sql: "UPDATE users SET email = CONCAT('user', id, '@example.invalid')"
      requires_table: users
    - name: reset-user-passwords
      operation: reset_passwords
      table: users
      column: password
      value: "$2y$10$disabledhashdisabledhashdisabledhashdisabledhashdi"

setup:
  commands:
    - run: "composer install --no-interaction"
    - { run: "php artisan migrate --force", allow_failure: true }
    - run: "php artisan optimize:clear"
    - { run: "php artisan storage:link", allow_failure: true }
