# Symfony. Uses discrete DATABASE_* variables plus a composed DATABASE_URL,
# which is what most Symfony projects with a .env.local actually carry.
# Both forms must stay consistent: the URL's host/db name embed the same
# ${DDEV_SITENAME} and ${SYNC_TARGET_DATABASE} placeholders as the discrete
# variables, so a project reading either lands on the same database.
name: symfony

detect:
  version_from:
    composer_package: symfony/framework-bundle

env:
  file: [.env.local, .env]
  strategy: patch_keys
  set:
    APP_ENV: dev
    APP_DEBUG: "1"
    DATABASE_NAME: "${SYNC_TARGET_DATABASE}"
    DATABASE_USER: db
    DATABASE_PASSWORD: db
    DATABASE_HOST: "ddev-${DDEV_SITENAME}-db"
    DATABASE_PORT: "3306"
    DATABASE_URL: "mysql://db:db@ddev-${DDEV_SITENAME}-db:3306/${SYNC_TARGET_DATABASE}"
    MAILER_DSN: "smtp://localhost:1025"

database:
  remote_credentials: env
  env_map:
    name: DATABASE_NAME
    user: DATABASE_USER
    password: DATABASE_PASSWORD
    host: DATABASE_HOST
    port: DATABASE_PORT

files:
  paths:
    - { remote: "public/uploads/", local: "public/uploads/" }

sanitize:
  rules:
    # `${SYMFONY_USER_TABLE}` (operations/placeholders.py) resolves
    # `database.symfony_user_table` with a default of `user` - Symfony itself
    # has no component that creates a `user` table; `user` is only
    # MakerBundle's conventional default, and MakerBundle itself steers
    # projects towards `users` or `app_user` because `user` is a reserved
    # word in PostgreSQL. A project whose entity table differs sets
    # `database.symfony_user_table` in .ddev/ddev-sync.yaml; see
    # profiles/VERIFIED.md. `requires_table` on the sql rule lets the Part 3
    # preflight probe catch a wrong name before the dump - this rule is
    # first in the list, so a silent failure here used to cost
    # reset-user-passwords and clear-messenger too, not just itself.
    - name: anonymize-users
      operation: fake
      table: "${SYMFONY_USER_TABLE}"
      columns:
        email: email
    - name: reset-user-passwords
      operation: reset_passwords
      table: "${SYMFONY_USER_TABLE}"
      column: password
      value: "$argon2i$disabled"
    # No separate rule for symfony/scheduler: it is a Messenger transport,
    # not its own store - a schedule's generated messages are consumed like
    # any other Messenger message, so their state already lives in the table
    # this rule truncates. See profiles/VERIFIED.md for the check.
    #
    # `messenger_messages` only exists once the Doctrine transport has
    # actually been used: Symfony creates it lazily on first send/get unless
    # `auto_setup` is disabled, and a project that routes every message
    # through a different transport (AMQP, Redis, or the synchronous
    # transport) or sets `auto_setup: false` has no such table at all. This
    # rule is last in the list, so a missing table here is otherwise
    # harmless on its own - but this project's rule for Messenger/Scheduler
    # state is that it must always be cleared, not merely "cleared when the
    # table happens to exist", so the same
    # tolerate_missing_table used for profiles/typo3.yaml's optional
    # scheduler table applies here too.
    - name: clear-messenger
      sql: "TRUNCATE TABLE messenger_messages"
      tolerate_missing_table: true

setup:
  commands:
    - run: "composer install --no-interaction"
    - { run: "php bin/console doctrine:migrations:migrate --no-interaction", allow_failure: true }
    - run: "php bin/console cache:clear"
