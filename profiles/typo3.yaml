# TYPO3. Version deltas live in typo3@<major>.yaml.
# Env variable names follow the convention used by helhum/dotenv-connector and
# the TYPO3_* mapping most composer-based TYPO3 projects adopt. Projects that
# differ override database.env_map in .ddev/ddev-sync.yaml.
name: typo3

detect:
  version_from:
    composer_package: typo3/cms-core

env:
  file: [.env.local, .env]
  strategy: patch_keys
  set:
    TYPO3_DB_HOST: "ddev-${DDEV_SITENAME}-db"
    TYPO3_DB_USER: db
    TYPO3_DB_PASSWORD: db
    TYPO3_DB_PORT: "3306"
    TYPO3_DB_NAME: "${SYNC_TARGET_DATABASE}"
    TYPO3_GFX_PROCESSOR: ImageMagick
    TYPO3_GFX_PROCESSOR_PATH: /usr/bin/
    TYPO3_MAIL_TRANSPORT: sendmail
    TYPO3_SYS_TRUSTED_HOSTS_PATTERN: ".*"

database:
  remote_credentials: env
  env_map:
    name: TYPO3_DB_NAME
    user: TYPO3_DB_USER
    password: TYPO3_DB_PASSWORD
    host: TYPO3_DB_HOST
    port: TYPO3_DB_PORT

files:
  paths:
    - { remote: "public/fileadmin/", local: "public/fileadmin/" }
    - { remote: "public/uploads/", local: "public/uploads/" }

sanitize:
  rules:
    - name: clear-be-sessions
      sql: "TRUNCATE TABLE be_sessions"
      requires_table: be_sessions
    # A scheduler task imported from production (e.g. a recurring "send
    # invoice reminders" or "call payment-provider webhook" task) is not
    # stale derived state like a processed image - it is production work
    # that would fire for real against real recipients the moment TYPO3's
    # own cron runs it locally. That makes it the same class of accident as
    # unsanitised mailer settings, not the same class as a stale cache, so
    # it belongs here in the base profile rather than in an optional
    # feature (spec §5.1): a feature you can forget does not protect you
    # from something you must not forget. `tx_scheduler_task` is EXT:scheduler's
    # task table and its name has been stable since well before v9 (only its
    # storage format changed, in v14); task groups live in a separate
    # `tx_scheduler_task_group` table that holds no executable state, so it
    # is not truncated here.
    #
    # Unlike `tx_scheduler_task`, `be_sessions` and `sys_log` (both already
    # truncated above/below) ARE always present: both are defined in
    # typo3/sysext/core/ext_tables.sql, part of typo3/cms-core itself, the
    # one package every TYPO3 install requires. EXT:scheduler is its own,
    # separate, optional Composer package (`typo3/cms-scheduler`, not
    # installed by default). A project that never required it has no
    # `tx_scheduler_task` table, and `_run_sql` raises unconditionally on any
    # other SQL error, so without `tolerate_missing_table` this rule being
    # second in the list would abort every rule after it - the password
    # resets, admin creation, cache flush, every setup command - on a
    # database already imported. `tolerate_missing_table` swallows only
    # "table doesn't exist" (MySQL errno 1146); any other failure here still
    # raises exactly as before.
    - name: clear-scheduler-tasks
      sql: "TRUNCATE TABLE tx_scheduler_task"
      tolerate_missing_table: true
    # `fe_sessions` and `fe_users` are NOT guaranteed the way `be_sessions`/
    # `sys_log` above are: both are defined in
    # typo3/sysext/frontend/ext_tables.sql, not typo3/sysext/core, and
    # typo3/cms-core's own composer.json does not require typo3/cms-frontend
    # (checked against both files at v13.4.2). A backend-only or
    # API/headless TYPO3 install - cms-core without cms-frontend - has
    # neither table. An earlier version of this profile's comment claimed
    # these three tables "all come from typo3/cms-core, always present",
    # which was wrong for exactly these two; `clear-fe-sessions`,
    # `anonymize-fe-users` and `reset-fe-passwords` below all now carry
    # `tolerate_missing_table` for the same reason `clear-scheduler-tasks`
    # does - an unconditional raise on a table a real install can lack would
    # abort every rule after it, database already imported.
    - name: clear-fe-sessions
      sql: "TRUNCATE TABLE fe_sessions"
      tolerate_missing_table: true
    - name: clear-sys-log
      sql: "TRUNCATE TABLE sys_log"
      requires_table: sys_log
    - name: anonymize-fe-users
      sql: "UPDATE fe_users SET email = CONCAT('fe', uid, '@example.invalid')"
      tolerate_missing_table: true
    - name: reset-fe-passwords
      operation: reset_passwords
      table: fe_users
      column: password
      value: "$argon2i$disabled"
      tolerate_missing_table: true
    # fe_users (frontend/website visitors) had both an anonymise and a reset
    # rule; be_users (backend/editor accounts) had neither, so a sync left
    # every real editor's email and password hash on the laptop untouched
    # while reporting "sanitize OK". Same treatment, same table shape.
    - name: anonymize-be-users
      sql: "UPDATE be_users SET email = CONCAT('be', uid, '@example.invalid')"
      requires_table: be_users
    - name: reset-be-passwords
      operation: reset_passwords
      table: be_users
      column: password
      value: "$argon2i$disabled"
    - name: local-admin
      operation: create_admin
      driver: typo3
      user: ddev
    - name: flush-cache
      operation: flush_cache
      command: "vendor/bin/typo3 cache:flush"

setup:
  commands:
    - run: "composer install --no-interaction"
    - run: "vendor/bin/typo3 database:updateschema"
      allow_failure: true
    - run: "vendor/bin/typo3 cache:flush"
