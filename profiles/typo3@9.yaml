extends: typo3
sanitize:
  rules:
    mode: replace
    values:
      - { name: clear-be-sessions, sql: "TRUNCATE TABLE be_sessions" }
      # See typo3.yaml for why this is a base rule, not a feature, and why it
      # carries tolerate_missing_table: EXT:scheduler is its own optional
      # Composer package, so a project without it has no table here, and
      # every rule after this one would otherwise be aborted silently.
      - name: clear-scheduler-tasks
        sql: "TRUNCATE TABLE tx_scheduler_task"
        tolerate_missing_table: true
      - { name: clear-fe-sessions, sql: "TRUNCATE TABLE fe_sessions" }
      - { name: clear-sys-log, sql: "TRUNCATE TABLE sys_log" }
      - name: anonymize-fe-users
        sql: "UPDATE fe_users SET email = CONCAT('fe', uid, '@example.invalid')"
      - name: reset-fe-passwords
        operation: reset_passwords
        table: fe_users
        column: password
        value: "$argon2i$disabled"
      - name: anonymize-be-users
        sql: "UPDATE be_users SET email = CONCAT('be', uid, '@example.invalid')"
      - name: reset-be-passwords
        operation: reset_passwords
        table: be_users
        column: password
        value: "$argon2i$disabled"
      - { name: local-admin, operation: create_admin, driver: console, user: ddev }
      - name: flush-cache
        operation: flush_cache
        command: "vendor/bin/typo3cms cache:flush"
setup:
  commands:
    mode: replace
    values:
      - run: "composer install --no-interaction"
      - { run: "vendor/bin/typo3cms database:updateschema", allow_failure: true }
      - run: "vendor/bin/typo3cms cache:flush"
