# WordPress. Deliberately shaped differently from the other profiles:
# credentials live in wp-config.php rather than an env file, DDEV generates
# wp-config-ddev.php itself, and URLs are rewritten with wp search-replace
# rather than raw SQL. If this profile needs no engine changes, the profile
# abstraction is doing its job.
name: wordpress

env:
  strategy: none

database:
  remote_credentials: wp_cli

files:
  paths:
    - { remote: "wp-content/uploads/", local: "wp-content/uploads/" }

sanitize:
  rules:
    - name: rewrite-site-url
      operation: search_replace
      driver: wp_cli
      from: "https://REPLACE-ME.example"
      to: "https://${DDEV_SITENAME}.ddev.site"
    # `${WP_TABLE_PREFIX}` resolves at parse time (operations/placeholders.py):
    # `database.wp_table_prefix` if a project sets it, otherwise
    # `wp config get table_prefix` read from the local wp-config.php. WordPress's
    # table prefix is configurable ($table_prefix in wp-config.php, default
    # `wp_`), so hardcoding `wp_users` here silently skipped every anonymise/
    # reset rule on any site that chose a different one - see
    # profiles/VERIFIED.md's wordpress row. `requires_table` lets the Part 3
    # preflight probe catch a wrong prefix before the dump, rather than
    # mid-sanitize with the database already imported.
    - name: anonymize-users
      sql: "UPDATE ${WP_TABLE_PREFIX}users SET user_email = CONCAT('user', ID, '@example.invalid')"
      requires_table: "${WP_TABLE_PREFIX}users"
    - name: reset-user-passwords
      operation: reset_passwords
      table: "${WP_TABLE_PREFIX}users"
      column: user_pass
      value: "$P$Bdisabledhashdisabledhashdisabledha"
    - name: local-admin
      operation: create_admin
      driver: wp_cli
      user: ddev

setup:
  commands:
    - { run: "wp cache flush", allow_failure: true, workdir: "." }
