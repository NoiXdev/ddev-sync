# A stand-in production host: an sshd with the project layout the profiles
# expect, and a database beside it.
name: ddev-sync-integration

services:
  remote:
    image: linuxserver/openssh-server:latest
    environment:
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
      - USER_NAME=deploy
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
      # There is no `openssh-server-mysql-client` mod: the linuxserver
      # docker-mods repository (branches, one per mod) has no such branch.
      # `universal-package-install` is the generic mod that installs an
      # arbitrary apk/apt package list at startup; `mariadb-client` is the
      # Alpine package that provides `mysqldump`, and `rsync` is needed on
      # this side too - the client-side `rsync` invoked locally connects
      # over ssh to an `rsync --server` process that has to exist here.
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=mariadb-client|rsync
    volumes:
      - ./.keys:/keys:ro
      - ./fixtures/remote:/srv/app
    ports:
      - "127.0.0.1:22022:2222"
    # Neither this image nor `mariadb:11` below ships a built-in HEALTHCHECK,
    # so without one `docker compose up --wait` has nothing to wait on and
    # reports "healthy" the instant the container starts - well before sshd
    # is listening or DOCKER_MODS has finished installing the mysql client.
    # Checking for both the authorized key and the installed client, not
    # just the port, is what actually proves the mod finished.
    # `mariadb-client` pulls in enough of its own dependency chain (observed
    # up to ~70s on a cold apk cache) that the original 30 retries * 2s = 60s
    # budget intermittently timed out before the mod finished installing,
    # not before sshd was ready. 60 * 3s = 180s leaves real headroom; an
    # already-warm cache still finishes in a few seconds either way.
    healthcheck:
      test: ["CMD-SHELL", "test -s /config/.ssh/authorized_keys && command -v mysqldump && command -v rsync && nc -z localhost 2222"]
      interval: 3s
      timeout: 5s
      retries: 60

  # A stand-in for the machine you SSH to on the way in: under
  # `provider: docker` the engine connects here as an ordinary user and
  # ProxyJump opens the final hop from this container, which is why the inner
  # host is addressed as `remote:2222` - a name that resolves *here*, on the
  # jump, and not on the developer's machine.
  #
  # No DOCKER_MODS: it forwards a connection and runs nothing itself. That is
  # also what makes it a fair model of the real shape, where the Docker host
  # carries no sync tooling at all.
  jump:
    image: linuxserver/openssh-server:latest
    environment:
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
      - USER_NAME=deploy
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
    volumes:
      - ./.keys:/keys:ro
      # Turns on the one setting a jump host needs; see the script. One
      # directory above this suite, because the matrix stack mounts the same
      # hook into its own jump - one copy, two suites.
      - ../jump-init:/custom-cont-init.d:ro
    ports:
      - "127.0.0.1:22023:2222"
    # Same reason as `remote` below: the image ships no HEALTHCHECK, so
    # `--wait` would otherwise be satisfied before sshd is listening. Fewer
    # retries than `remote` needs, because nothing is being installed here.
    healthcheck:
      test: ["CMD-SHELL", "test -s /config/.ssh/authorized_keys && nc -z localhost 2222"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The sync endpoint the stack publishes, built from this repository: the
  # far side of `provider: docker`, and the thing the engine actually talks
  # to once the jump has opened the hop.
  #
  # `network_mode` rather than a network of its own, because that is what a
  # published port *is*: the endpoint has no address anything outside can
  # reach, `127.0.0.1:22` on the jump is this container, and `db` below still
  # resolves here - which is how the endpoint reads credentials from a .env
  # naming a compose service and needs none of its own.
  endpoint:
    build:
      context: ../../endpoint
    network_mode: "service:jump"
    environment:
      # The image's own default. The fixtures this endpoint reads are
      # world-readable (a checkout's 644 files under 755 directories), so any
      # uid can read them and this suite has no reason to vary it - the test
      # that needs a uid mismatch creates one inside the container instead.
      # The matrix cell is where the uid is pinned to the files' real owner.
      - DDEV_SYNC_UID=33
      - DDEV_SYNC_GID=33
    volumes:
      # The *file* source of the authorised keys, deliberately: task 1's own
      # tests cover the environment variable, so between them both halves of
      # the union are exercised by a real sync.
      - ./.keys/id_ed25519.pub:/etc/ddev-sync/authorized_keys:ro
      # The same tree the `remote` service serves, so a docker target and a
      # server target can be pointed at the same path and compared.
      - ./fixtures/remote:/srv/app:ro
      - endpoint-hostkeys:/etc/ssh/keys
    healthcheck:
      # Port 22 in LISTEN, read from /proc because the image carries three
      # binaries on purpose and a healthcheck is no reason for a fourth.
      test: ["CMD-SHELL", "grep -qiE ':0016 [0-9A-F]+:0000 0A' /proc/net/tcp"]
      interval: 2s
      timeout: 5s
      retries: 30

  db:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=acme_prod
      - MARIADB_USER=acme
      - MARIADB_PASSWORD=s3cret
    volumes:
      - ./fixtures/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  local-db:
    image: mariadb:11
    # `--skip-ssl`, so this stand-in has no certificate at all - like DDEV's
    # MariaDB 10.x images, and unlike its 11.x ones, which generate one. The
    # no-certificate case is the one worth modelling, because it is how the 11.8
    # client's default broke every local database call in the field while every
    # suite stayed green. It is not the only way a server can refuse - DDEV's
    # MySQL images fail verification on a self-signed certificate instead - and
    # nothing here covers either that or 11.x with TLS.
    # The production stand-in in this file keeps its own TLS, which a real host
    # may well have.
    command: ["--skip-ssl"]
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=db
      - MARIADB_USER=db
      - MARIADB_PASSWORD=db
    ports:
      - "127.0.0.1:23306:3306"
    networks:
      default:
        aliases:
          - ddev-acme-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A stand-in for DDEV's web container: the place framework CLIs run
  # (transport/container.py). Alpine is enough - the stubs the project
  # fixture writes are `#!/bin/sh` scripts, and no real framework is
  # installed here; verifying real framework commands is Plan 5's job.
  #
  # The project is mounted at /var/www/html, DDEV's fixed mount point in the
  # web container, because that is where `web_command` translates a workdir
  # to. The engine in this suite runs on the host and reads the project at its
  # host path; the translation is what bridges the two.
  web:
    image: alpine:3.21
    container_name: ddev-acme-web
    command: ["sleep", "infinity"]
    volumes:
      - ${DDEV_SYNC_PROJECT_DIR}:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -d /var/www/html"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  # The endpoint's host key has to outlive the container here too: the test
  # that drops this volume is the one proving what happens when a real stack
  # does, and it would prove nothing if every recreate rolled the key anyway.
  endpoint-hostkeys:
