# The docker provider, end to end: the stack publishes a sync endpoint, the
# engine reaches it through the host, and the endpoint reads the credentials
# from the environment the stack gives it: it mounts no .env.
#
# `host`/`user`/`port` are the stand-in Docker host - the `jump` service -
# and `sync_port` is where that host publishes the endpoint. Under this
# provider `path` is read *inside* the endpoint, which is why it names the
# mount point the compose file gave it rather than a path on the host.
version: 1
targets:
  production:
    provider: docker
    host: jump
    user: deploy
    port: 2222
    sync_port: 22
    path: /srv/app/
    stage: production
database:
  # `env`, where every other cell says `explicit`: this is the one claim of
  # the design that only a real stack can settle - the endpoint has no
  # credentials file and mounts no .env, it is handed production's
  # credentials as environment variables, and the database host among them is
  # a compose service name that resolves because the endpoint sits inside the
  # stack's network.
  remote_credentials: env
