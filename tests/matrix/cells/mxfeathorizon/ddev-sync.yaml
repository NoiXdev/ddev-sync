# `remote_credentials: explicit` keeps the cell from depending on a .env on
# the remote: this cell is about one feature's command, not about credential
# discovery, which the unit suite already covers exhaustively.
#
# No `features:` key: a key switches detection off for the whole project
# (features/resolver.py), and `horizon` is meant to be found by detection,
# from the composer package the recipe installs.
#
# Two things about `env:` are shown here, one by its absence and one by its
# presence. The recipe writes `QUEUE_CONNECTION=redis` and the block below does
# not name it: `profiles/laravel.yaml` only defaults that key, so the sync
# leaves it alone, where an earlier profile imposed `sync` and a Horizon
# project had to override it back to stay on Redis.
#
# The block below overrides `MAIL_PORT`, which the profile imposes as `1025`,
# and nothing else. It exists to show that the `env` mapping merges per key
# (`config/merge.py::merge_layers` recurses into mappings): the project's value
# wins for the key it names, while every other imposed key, `MAIL_HOST` among
# them, still lands. A key about mail on purpose - nothing in this cell sends
# mail, so it cannot touch the queue evidence above.
version: 1
targets:
  production:
    host: remote
    user: deploy
    port: 2222
    path: /srv/app/
    stage: production
env:
  set:
    MAIL_PORT: "2525"
database:
  remote_credentials: explicit
  credentials:
    name: acme_prod
    user: acme
    password: s3cret
    host: remote-db
    port: "3306"
