# `remote_credentials: explicit` keeps the cell from depending on a .env on
# the remote: this cell is about one feature's command, not about credential
# discovery, which the unit suite already covers exhaustively.
#
# No `features:` key: a key switches detection off for the whole project
# (features/resolver.py), and `horizon` is meant to be found by detection,
# from the composer package the recipe installs.
#
# No `env:` block either, and that absence is what this cell shows. The recipe
# writes `QUEUE_CONNECTION=redis`; `profiles/laravel.yaml` only defaults that
# key, so the sync leaves it alone. An earlier profile imposed `sync`, and a
# Horizon project had to override it back here to stay on Redis.
version: 1
targets:
  production:
    host: remote
    user: deploy
    port: 2222
    path: /srv/app/
    stage: production
database:
  remote_credentials: explicit
  credentials:
    name: acme_prod
    user: acme
    password: s3cret
    host: remote-db
    port: "3306"
