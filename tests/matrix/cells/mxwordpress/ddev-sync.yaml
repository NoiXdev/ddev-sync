# No `database.credentials` and no `database.wp_table_prefix`: the profile's own
# `wp_cli` source reads the connection settings and the table prefix from
# production's wp-config.php by running `wp config get` over ssh, which is the
# path `${WP_TABLE_PREFIX}` exists for. The stand-in production host has PHP and
# wp-cli for that (see `Cell.remote_packages` and `remote-init/`), and a
# wp-config.php of its own (`remote-only/`).
version: 1
targets:
  production:
    host: remote
    user: deploy
    port: 2222
    path: /srv/app/
    stage: production
database:
  remote_credentials: wp_cli
sanitize:
  # The profile's shipped `rewrite-site-url` rule resolves its `from` through
  # `${PRODUCTION_URL}` (operations/placeholders.py), which reads this key -
  # no profile can know a project's production URL by itself. This cell used
  # to carry its own `sanitize.rules` entry instead: a plain list under
  # `sanitize.rules` *extends* the profile's list rather than replacing it
  # (config/merge.py's default list mode), so that entry ran as a *second*
  # `rewrite-site-url` rule alongside the shipped one, which matched nothing
  # and did real work only through the duplicate. With the placeholder
  # resolving, the shipped rule now does that work by itself and the
  # duplicate is gone.
  production_url: https://acme-production.example
