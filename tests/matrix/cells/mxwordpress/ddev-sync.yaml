# No `database.credentials` and no `database.wp_table_prefix`: the profile's own
# `wp_cli` source reads the connection settings and the table prefix from
# production's wp-config.php by running `wp config get` over ssh, which is the
# path `${WP_TABLE_PREFIX}` exists for. The stand-in production host has PHP and
# wp-cli for that (see `Cell.remote_packages` and `remote-init/`), and a
# wp-config.php of its own (`remote-only/`).
version: 1
targets:
  production:
    host: remote
    user: deploy
    port: 2222
    path: /srv/app/
    stage: production
database:
  remote_credentials: wp_cli
sanitize:
  rules:
    # The per-project override VERIFIED.md says this profile needs: the
    # shipped rule carries `https://REPLACE-ME.example`, a placeholder by
    # design, because no profile can know a project's production URL. A list
    # in the project config *extends* the profile's rules, so this runs in
    # addition to that placeholder rule rather than instead of it.
    - name: rewrite-site-url
      operation: search_replace
      driver: wp_cli
      from: https://acme-production.example
      to: https://mxwordpress.ddev.site
