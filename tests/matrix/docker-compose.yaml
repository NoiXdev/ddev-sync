# One stack, parameterised per cell by the environment. The service names are
# DDEV's, because that is what the engine addresses: `ddev-<cell>-web` by
# container name (docker exec takes a name, not an alias) and `ddev-<cell>-db`
# by network alias (the engine passes `--host=ddev-<cell>-db` to the client).
#
# `${MATRIX_PROJECT_DIR}` is mounted at /var/www/html, DDEV's fixed mount
# point in the web container, because that is where
# `transport/container.py::web_command` translates a workdir to. The engine
# container is not in this file: `stack.py::engine` mounts the project at its
# host path and tells the engine where it is.
name: ddev-sync-matrix-${MATRIX_CELL}

services:
  web:
    # Built rather than pulled: a bare `php:*-cli` has no composer, no PDO
    # MySQL driver and no git, so neither the installers nor the profile's own
    # setup commands could run in it. See web/Dockerfile.
    build:
      context: ./web
      args:
        PHP_IMAGE: ${MATRIX_PHP_IMAGE}
    image: ddev-sync-matrix-${MATRIX_CELL}-web
    container_name: ddev-${MATRIX_CELL}-web
    command: ["sleep", "infinity"]
    user: "${MATRIX_UID}:${MATRIX_GID}"
    working_dir: /var/www/html
    environment:
      # composer, wp-cli and drush all write caches under $HOME; without a
      # writable one they fail in ways that read like network errors.
      - HOME=/tmp
    volumes:
      - ${MATRIX_PROJECT_DIR}:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -v > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  local-db:
    image: mariadb:11
    # `--skip-ssl`, so this stand-in has no certificate at all - like DDEV's
    # MariaDB 10.x images, and unlike its 11.x ones, which generate one. The
    # no-certificate case is the one worth modelling, because it is how the 11.8
    # client's default broke every local database call in the field while every
    # suite stayed green. It is not the only way a server can refuse - DDEV's
    # MySQL images fail verification on a self-signed certificate instead - and
    # nothing here covers either that or 11.x with TLS.
    # The production stand-in in this file keeps its own TLS, which a real host
    # may well have.
    command: ["--skip-ssl"]
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=db
      - MARIADB_USER=db
      - MARIADB_PASSWORD=db
    networks:
      default:
        aliases:
          - ddev-${MATRIX_CELL}-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  remote-db:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=acme_prod
      - MARIADB_USER=acme
      - MARIADB_PASSWORD=s3cret
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  remote:
    image: linuxserver/openssh-server:latest
    environment:
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
      - USER_NAME=deploy
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
      # The remote needs a mysql client for the dump and rsync for the files
      # step; `universal-package-install` is the generic mod that installs an
      # arbitrary package list at startup.
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      # Per cell: the default is what every sync needs, and a cell whose
      # profile runs commands on production (WordPress's `wp` over ssh) adds
      # what they need - see `Cell.remote_packages`.
      - INSTALL_PACKAGES=${MATRIX_REMOTE_PACKAGES:-mariadb-client|rsync}
    volumes:
      - ${MATRIX_KEYS_DIR}:/keys:ro
      - ${MATRIX_REMOTE_DIR}:/srv/app
      # Installs wp-cli when - and only when - the cell asked for PHP.
      - ./remote-init:/custom-cont-init.d:ro
    healthcheck:
      # Checking the installed client, not just the port: the mod finishes
      # well after sshd starts listening, and a dump that races it fails with
      # "mysqldump: not found". Likewise `wp`, for the cell that has PHP.
      test: ["CMD-SHELL", "test -s /config/.ssh/authorized_keys && command -v mysqldump && command -v rsync && { ! command -v php83 || command -v wp; } && nc -z localhost 2222"]
      interval: 3s
      timeout: 5s
      retries: 60

  # The stand-in Docker host, for the cell that syncs through `provider:
  # docker`. Behind a profile because only that cell has any use for it: the
  # engine connects here as an ordinary user and ProxyJump opens the final hop
  # from this container, which is why the endpoint below is addressed as
  # `127.0.0.1:22` - an address that means something *here*, on the host, and
  # nothing on the developer's machine.
  #
  # No DOCKER_MODS: a Docker host carries no sync tooling, and this one
  # forwards a connection and runs nothing.
  jump:
    image: linuxserver/openssh-server:latest
    profiles:
      - jump
    environment:
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
      - USER_NAME=deploy
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
    volumes:
      - ${MATRIX_KEYS_DIR}:/keys:ro
      # The one setting a jump host needs; the same hook the integration
      # suite mounts, kept in one place for both.
      - ../jump-init:/custom-cont-init.d:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /config/.ssh/authorized_keys && nc -z localhost 2222"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The sync endpoint, built from this repository: the far side of `provider:
  # docker`, inside the stack it belongs to.
  #
  # `network_mode` rather than a network of its own, because that is what a
  # published port is: the endpoint has no address anything outside can reach,
  # `127.0.0.1:22` on the jump is this container, and `remote-db` still
  # resolves here - which is how it reaches a database host that is a compose
  # service name.
  #
  # The endpoint mounts no .env: production's credentials are the stack's
  # environment, handed over by name in DDEV_SYNC_EXPORT_ENV, and the endpoint
  # writes them to /run/ddev-sync/app.env for the engine to read. `remote-db`
  # is the host for the same reason as above - the endpoint resolves it
  # because it shares the stack's network. The values are those `remote-db`
  # is created with, further up.
  endpoint:
    build:
      context: ../../endpoint
    profiles:
      - endpoint
    network_mode: "service:jump"
    environment:
      # The uid and gid that own the files the harness wrote on the host. The
      # spec calls a mismatch here the likeliest misconfiguration of this
      # provider, so the cell pins it to the value that is right rather than
      # leaving the image's default to be right by luck.
      - DDEV_SYNC_UID=${MATRIX_UID}
      - DDEV_SYNC_GID=${MATRIX_GID}
      - DDEV_SYNC_EXPORT_ENV=DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD
      - DB_HOST=remote-db
      - DB_PORT=3306
      - DB_DATABASE=acme_prod
      - DB_USERNAME=acme
      - DB_PASSWORD=s3cret
    volumes:
      - ${MATRIX_KEYS_DIR}/id_ed25519.pub:/etc/ddev-sync/authorized_keys:ro
      # The same tree the `remote` service serves, so what differs between
      # this cell and a server-provider cell is the transport and nothing else.
      - ${MATRIX_REMOTE_DIR}:/srv/app:ro
      - endpoint-hostkeys:/etc/ssh/keys
    healthcheck:
      # Port 22 in LISTEN, read from /proc: the image carries three binaries
      # on purpose and a healthcheck is no reason for a fourth.
      test: ["CMD-SHELL", "grep -qiE ':0016 [0-9A-F]+:0000 0A' /proc/net/tcp"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Behind a profile, like `elasticsearch` below: only the cells that name it
  # have any use for it, and a profile is how compose is told not to start a
  # service by default. `Cell.services` names the profile, and `stack.py::up`
  # turns each name into a `--profile` argument. Deliberately no headcount
  # here: a number in a comment goes stale every time the registry grows, and
  # this sentence used to carry one - "six of the cells" - which the very
  # branch that added these two services left behind. The count lives in
  # tests/matrix/cells.py, where it is derived rather than restated.
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    networks:
      default:
        aliases:
          - ddev-${MATRIX_CELL}-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # `discovery.type=single-node` and security off, because this is a throwaway
  # test instance with no cluster to join and no credential worth having; the
  # heap is pinned low for the same reason. Measured 2026-10-10 with
  # elasticsearch:9.0.0: this configuration answered on its HTTP port 11
  # seconds after `docker run` and reported cluster status green.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    profiles:
      - elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      default:
        aliases:
          - ddev-${MATRIX_CELL}-es
    healthcheck:
      # `start_period` rather than more retries: during it a failing probe
      # does not count against `retries`, so a slow runner gets time to boot
      # without the ceiling being spent on the boot itself. Measured here:
      # this configuration answered 11 seconds after `docker run`, so 60
      # seconds is roughly five times the observed start and the 2s/60 retry
      # budget then covers a service that answered once and stopped - which is
      # a different failure, and the one the retries are for.
      start_period: 60s
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  # Per stack, so the endpoint's host key outlives a recreated container here
  # as it must in production: the engine refuses a *changed* key, and a cell
  # whose key rolled under it would fail as though it were being attacked.
  endpoint-hostkeys:
